name: CI

on:
  push:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: v0.11.0
  HADOLINT_VERSION: v2.15.1

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.aarch64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-$SHELLCHECK_VERSION/shellcheck"
          shellcheck -x --severity=warning --shell=bash --exclude=SC1090 \
            bin/lib.sh bin/sandbox bin/sandbox-build bin/sandbox-src-hash \
            install.sh image/entrypoint.sh image/setup.sh image/sandbox-k3s \
            image/sandbox-code image/sandbox-idle image/sandbox-welcome \
            image/sandbox-kubeconfig
          shellcheck -x --severity=warning --shell=sh --exclude=SC1090 \
            image/sandbox-nice.sh image/sandbox-background image/sandbox-config.sh
          shellcheck -x --severity=warning --shell=bash --exclude=SC1090,SC2034 test/run.sh

      - name: hadolint
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/$HADOLINT_VERSION/hadolint-linux-arm64"
          chmod +x /usr/local/bin/hadolint
          hadolint image/Dockerfile

  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: bash test/run.sh

  runtime:
    name: --init reaps orphans on Apple Container
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CONTAINER_VERSION: '1.2.2'
      PROBE_IMAGE: 'docker.io/library/alpine:3'
    steps:
      - uses: actions/checkout@v7

      - name: Install Apple Container
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o container.pkg \
            "https://github.com/apple/container/releases/download/$CONTAINER_VERSION/container-$CONTAINER_VERSION-installer-signed.pkg"
          sudo installer -pkg container.pkg -target /
          container --version

      - name: Start the runtime
        run: |
          container system start --enable-kernel-install --timeout 120
          container run --rm "$PROBE_IMAGE" true
          echo "the runtime can run a container on this runner"

      - name: --init replaces PID 1
        run: |
          cmdline() {
            container run --rm "$@" "$PROBE_IMAGE" \
              sh -c 'tr "\0" " " < /proc/1/cmdline' | tr -d '\r'
          }
          plain="$(cmdline)"
          init="$(cmdline --init)"
          echo "PID 1 without --init: $plain"
          echo "PID 1 with    --init: $init"
          case "$plain" in *sh*) ;; *) echo "expected the command at PID 1 without --init" >&2; exit 1 ;; esac
          [ "$plain" != "$init" ]

      - name: Orphans are reaped under --init
        run: |
          cat > probe.sh <<'PROBE'
          setsid sh -c 'sleep 1 &' </dev/null >/dev/null 2>&1
          sleep 5
          n=0
          for f in /proc/[0-9]*/stat; do
            line=$(cat "$f" 2>/dev/null) || continue
            rest=${line#*') '}
            state=${rest%% *}
            rest=${rest#* }
            ppid=${rest%% *}
            if [ "$state" = Z ] && [ "$ppid" = 1 ]; then n=$((n + 1)); fi
          done
          echo "ZOMBIES=$n"
          PROBE
          probe="$(cat probe.sh)"
          count() {
            container run --rm "$@" "$PROBE_IMAGE" sh -c "$probe" \
              | tr -d '\r' | sed -n 's/^ZOMBIES=//p' | tail -1
          }
          with="$(count --init)"
          without="$(count)"
          echo "zombies left under PID 1 -- with --init: ${with:-?}, without: ${without:-?}"
          [ "$with" = 0 ]
          if [ "$without" = 0 ]; then
            echo "note: the control also reaped, so this run only shows --init does no harm" >&2
          fi

  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Seed config.toml
        run: cp config.toml.example config.toml

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: image/Dockerfile
          tags: sandbox:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha
          no-cache: ${{ github.event_name == 'schedule' }}

      - name: Smoke test
        env:
          IMAGE: sandbox:ci
        run: |
          docker run --rm "$IMAGE" bash -c 'test -f "$HOME/.sandbox-seeded" && test -f "$HOME/.zshrc"'
          docker run --rm "$IMAGE" bash -c 'zellij --version && gum --version && kubectl version --client'
          docker run --rm "$IMAGE" sandbox-setup
          docker run --rm "$IMAGE" bash -c \
            'test -L /var/lib/sandbox/kube/config && test -f "$HOME/.kube/config"'
          docker run --rm "$IMAGE" bash -c 'kubectl config view >/dev/null'

      - name: Man page and welcome
        env:
          IMAGE: sandbox:ci
        run: |
          docker run --rm --entrypoint man "$IMAGE" 7 sandbox > page.txt
          grep -q 'INSTALLED TOOLS' page.txt
          grep -q 'podman' page.txt
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'echo exit | zsh -i 2>&1 | grep -q "man sandbox"'
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'echo exit | zsh -i >/dev/null 2>&1; echo exit | zsh -i 2>&1 | grep -q "man sandbox" && exit 1; exit 0'

      - name: Claude's commands run as background work
        env:
          IMAGE: sandbox:ci
        run: |
          docker run --rm --entrypoint zsh -e CLAUDECODE=1 "$IMAGE" -c \
            '[ "$(nice)" = 10 ] && [ "$(cat /proc/self/oom_score_adj)" = 1000 ]'
          docker run --rm --entrypoint zsh "$IMAGE" -c \
            '[ "$(nice)" = 0 ] && [ "$(cat /proc/self/oom_score_adj)" = 0 ]'
          docker run --rm --entrypoint man "$IMAGE" 7 sandbox | grep -q 'COMMANDS RUN BY CLAUDE'
          docker run --rm --entrypoint sandbox-background "$IMAGE" sh -c \
            '[ "$(nice)" = 10 ] && [ "$(cat /proc/self/oom_score_adj)" = 1000 ]'

      - name: k3s is in every image
        env:
          IMAGE: sandbox:ci
        run: |
          docker run --rm --entrypoint k3s "$IMAGE" --version
          docker run --rm --entrypoint man "$IMAGE" 7 sandbox | grep -q 'sandbox-k3s'
          docker run --rm --entrypoint man "$IMAGE" 7 sandbox \
            | tr -s '[:space:]' ' ' | grep -q 'does not start at launch'
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'sandbox-background /usr/local/bin/k3s --version | grep -q "k3s version"'

      - name: The VS Code CLI is in every image
        env:
          IMAGE: sandbox:ci
        run: |
          docker run --rm --entrypoint code "$IMAGE" --version
          docker run --rm --entrypoint bash "$IMAGE" -c '! sandbox-code up >/dev/null 2>&1'
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'sandbox-code up 2>&1 | grep -q "sandbox-code login"'
          docker run --rm --entrypoint man "$IMAGE" 7 sandbox | grep -q 'sandbox-code'

      - name: A headless sandbox holds open and stops on the signal
        env:
          IMAGE: sandbox:ci
        run: |
          docker run --rm --entrypoint sandbox-idle "$IMAGE" --help | grep -q headless
          docker run --detach --rm --name idle --entrypoint sandbox-idle "$IMAGE"
          sleep 3
          docker inspect -f '{{.State.Running}}' idle | grep -qx true
          start=$SECONDS
          docker stop idle
          elapsed=$((SECONDS - start))
          echo "docker stop returned in ${elapsed}s"
          [ "$elapsed" -lt 5 ]
          docker run --rm --entrypoint man "$IMAGE" 7 sandbox | grep -q 'sandbox-idle'
