name: CI

on:
  push:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: v0.11.0
  HADOLINT_VERSION: v2.15.1

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # sandbox-zellij and sandbox-prompt.zsh are zsh, which ShellCheck can't parse.
      - name: ShellCheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.aarch64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-$SHELLCHECK_VERSION/shellcheck"
          shellcheck -x --severity=warning \
            bin/lib.sh bin/sandbox bin/sandbox-build bin/sandbox-src-hash \
            install.sh image/entrypoint.sh image/setup.sh image/sandbox-k3s \
            image/sandbox-code image/sandbox-welcome image/sandbox-kubeconfig \
            image/sandbox-nice.sh image/sandbox-background \
            image/sandbox-config.sh test/run.sh

      - name: hadolint
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/$HADOLINT_VERSION/hadolint-linux-arm64"
          chmod +x /usr/local/bin/hadolint
          hadolint image/Dockerfile

  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: bash test/run.sh

  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        config: [default, k3s, vscode]
    steps:
      - uses: actions/checkout@v7

      # Every optional section is named after its matrix row and gated on its
      # own `enabled`, so one flip covers them all — scoped to the section, since
      # more than one carries that key.
      - name: Seed config.toml
        env:
          SECTION: ${{ matrix.config }}
        run: |
          cp config.toml.example config.toml
          if [ "$SECTION" != default ]; then
            awk -v s="[$SECTION]" '
              /^\[/     { in_s = ($0 == s) }
              in_s && $0 == "enabled = false" { $0 = "enabled = true" }
                        { print }' config.toml > seeded.toml
            mv seeded.toml config.toml
            [ "$(awk -v s="[$SECTION]" '
              /^\[/ { in_s = ($0 == s) }
              in_s && $0 ~ /^enabled = / { print $3 }' config.toml)" = true ]
          fi

      - uses: docker/setup-buildx-action@v4

      # The layer cache is keyed on file content, so a formula breaking upstream
      # while our files are unchanged only surfaces in the weekly uncached run.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: image/Dockerfile
          tags: sandbox:${{ matrix.config }}
          load: true
          cache-from: type=gha,scope=${{ matrix.config }}
          cache-to: type=gha,scope=${{ matrix.config }}
          no-cache: ${{ github.event_name == 'schedule' }}

      # The entrypoint runs through sandbox-k3s on the k3s image, where an
      # unprivileged `up` fails, and through sandbox-code on the vscode image,
      # which is signed in to nothing — so this also covers a failed cluster or
      # an unusable tunnel leaving the shell reachable.
      - name: Smoke test
        env:
          IMAGE: sandbox:${{ matrix.config }}
        run: |
          docker run --rm "$IMAGE" bash -c 'test -f "$HOME/.sandbox-seeded" && test -f "$HOME/.zshrc"'
          docker run --rm "$IMAGE" bash -c 'zellij --version && gum --version && kubectl version --client'
          docker run --rm "$IMAGE" sandbox-setup
          # The entrypoint assembled a kubeconfig KUBECONFIG can actually reach.
          docker run --rm "$IMAGE" bash -c \
            'test -L /var/lib/sandbox/kube/config && test -f "$HOME/.kube/config"'
          docker run --rm "$IMAGE" bash -c 'kubectl config view >/dev/null'

      # The page is generated from the config that built the image, so a row
      # whose config lists podman must have podman in its page. The welcome
      # runs from /etc/zsh/zshrc, and has to print for the first interactive
      # shell of a container and for no other.
      - name: Man page and welcome
        env:
          IMAGE: sandbox:${{ matrix.config }}
        run: |
          docker run --rm --entrypoint man "$IMAGE" 7 sandbox > page.txt
          grep -q 'INSTALLED TOOLS' page.txt
          grep -q 'podman' page.txt
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'echo exit | zsh -i 2>&1 | grep -q "man sandbox"'
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'echo exit | zsh -i >/dev/null 2>&1; echo exit | zsh -i 2>&1 | grep -q "man sandbox" && exit 1; exit 0'

      # The wiring, not just the script: a real zsh -c in the built image, which
      # is how Claude Code spawns every command it runs.
      - name: Claude's commands run as background work
        env:
          IMAGE: sandbox:${{ matrix.config }}
        run: |
          docker run --rm --entrypoint zsh -e CLAUDECODE=1 "$IMAGE" -c \
            '[ "$(nice)" = 10 ] && [ "$(cat /proc/self/oom_score_adj)" = 1000 ]'
          docker run --rm --entrypoint zsh "$IMAGE" -c \
            '[ "$(nice)" = 0 ] && [ "$(cat /proc/self/oom_score_adj)" = 0 ]'
          docker run --rm --entrypoint man "$IMAGE" 7 sandbox | grep -q 'COMMANDS RUN BY CLAUDE'
          # The same, asked for explicitly. sandbox-k3s starts the cluster this way.
          docker run --rm --entrypoint sandbox-background "$IMAGE" sh -c \
            '[ "$(nice)" = 10 ] && [ "$(cat /proc/self/oom_score_adj)" = 1000 ]'

      - name: k3s image contents
        if: matrix.config == 'k3s'
        env:
          IMAGE: sandbox:${{ matrix.config }}
        run: |
          docker run --rm --entrypoint k3s "$IMAGE" --version
          docker run --rm --entrypoint sandbox-k3s "$IMAGE" enabled
          docker run --rm --entrypoint man "$IMAGE" 7 sandbox | grep -q 'sandbox-k3s'
          # The cluster launch goes through the wrapper, which execs, so the
          # argv sandbox-k3s matches to find and stop the server is unchanged.
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'sandbox-background /usr/local/bin/k3s --version | grep -q "k3s version"'

      - name: vscode image contents
        if: matrix.config == 'vscode'
        env:
          IMAGE: sandbox:${{ matrix.config }}
        run: |
          docker run --rm --entrypoint code "$IMAGE" --version
          docker run --rm --entrypoint sandbox-code "$IMAGE" enabled
          # Signed in to nothing, `up` refuses and points at the login command.
          docker run --rm --entrypoint bash "$IMAGE" -c '! sandbox-code up >/dev/null 2>&1'
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'sandbox-code up 2>&1 | grep -q "sandbox-code login"'
          docker run --rm --entrypoint man "$IMAGE" 7 sandbox | grep -q 'sandbox-code'

      - name: Optional tooling absent by default
        if: matrix.config == 'default'
        env:
          IMAGE: sandbox:${{ matrix.config }}
        run: |
          docker run --rm --entrypoint bash "$IMAGE" -c '! command -v k3s'
          docker run --rm --entrypoint bash "$IMAGE" -c '! sandbox-k3s enabled'
          docker run --rm --entrypoint bash "$IMAGE" -c '! command -v code'
          docker run --rm --entrypoint bash "$IMAGE" -c '! sandbox-code enabled'
          # The page tracks the config, so with both features off it says so.
          docker run --rm --entrypoint man "$IMAGE" 7 sandbox | grep -q 'Disabled'
